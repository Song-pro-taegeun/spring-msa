// 공통 DTO, 공통 유틸 등 모든 서비스가 공유하는 라이브러리(Boot 아님)
plugins {
    id 'java'
    id 'io.spring.dependency-management'
}


// common-lib 은 Boot plugin 이 없기 때문에 Spring 의존성들이 버전관리를 못함.
// 따라서 mavenBom 추가
dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.12"
    }
}

dependencies {
    // validation → Boot starter 대신 javax validation 사용
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JWT 사용해도 OK
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
}
