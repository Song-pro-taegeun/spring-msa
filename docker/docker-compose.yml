services:
  # Zookeeper 설정 (Kafka의 서비스 디스커버리 및 리더 선출을 담당)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181 # Zookeeper의 클라이언트 연결 포트
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka 브로커 설정
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper # Kafka는 Zookeeper가 실행된 후 시작됨
    ports:
      - "9092:9092" # Kafka 기본 포트
      - "29092:29092" # 내부 통신을 위한 포트
    volumes:
      - ./kafka-data:/var/lib/kafka/data # 토픽 및 메시지 볼륨 설정
    environment:
      KAFKA_BROKER_ID: 1 # Kafka 브로커 ID
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # Zookeeper 연결 정보
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Kafka UI (provectus/kafka-ui) - 토픽 및 메시지 모니터링 가능
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "9090:8080" # Kafka UI 웹 접근 포트
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster # 클러스터 이름 설정
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092 # Kafka 브로커 연결 정보
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181 # Zookeeper 연결 정보

  # mariaDB
  mariadb:
    image: mariadb:10.6
    container_name: msa-mariadb
    restart: always
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: msa_auth
      MARIADB_USER: msa_master
      MARIADB_PASSWORD: 1234
      TZ: Asia/Seoul
    volumes:
      - mariadb-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
volumes:
  mariadb-data:

