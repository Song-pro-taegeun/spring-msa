spring:
  config:
    activate:
      on-profile: "local"
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: false
##  멀티커넥션에서 셋팅하기에 주석처리
#  datasource:
#    url: "jdbc:mariadb://localhost:3306/msa_user"
#    username: "msa_user_user"
#    password: "1234"
#    driver-class-name: org.mariadb.jdbc.Driver
  # 최초 테넌트 세팅 시 마스터권한 정보
  master-datasource:
    url: "jdbc:mariadb://localhost:3306/msa_user"
    username: "root"
    password: "1234"
    driver-class-name: org.mariadb.jdbc.Driver
  base-datasource:
    url: "jdbc:mariadb://localhost:3306/"
  base-schema-name: msa_user
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      connect-timeout: 2s
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "user-service:"
      use-key-prefix: true

kafka:
  host-port: "localhost:9092"