spring:
  config:
    activate:
      on-profile: "local"
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: true
  datasource:
    url: "jdbc:mariadb://localhost:3306/msa_user"
    username: "msa_user_user"
    password: "1234"
    driver-class-name: org.mariadb.jdbc.Driver
